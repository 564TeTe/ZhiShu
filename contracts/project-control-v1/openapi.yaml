        - status
        - scope
        - requiredCapabilities
        - profileCapabilities
        - workspaceLease
      properties:
        assignmentId: { type: string, format: uuid }
        nodeKey: { type: string, minLength: 1 }
        workerSlot: { type: integer, minimum: 1, maximum: 2 }
        profileId: { type: string, format: uuid }
        profileName: { type: string, minLength: 1 }
        executor: { type: string, minLength: 1 }
        status: { type: string, enum: [PROPOSED, READY_FOR_PROVISIONING, PROVISIONED, RUNNING, VERIFIED, FAILED, CANCELLED] }
        scope:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        requiredCapabilities:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        profileCapabilities:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
        workspaceLease: { $ref: '#/components/schemas/WorkspaceLease' }
    WorkspaceLease:
      type: object
      additionalProperties: false
      required:
        - leaseId
        - workspaceMode
        - physicalWorkspaceKind
        - workspaceRef
        - branchRef
        - status
        - provisioningState
        - workspacePath
        - leaseExpiresAt
        - provisioningStartedAt
        - provisionedAt
        - failureCode
        - failureMessage
        - cleanedAt
        - createdAt
        - releasedAt
      properties:
        leaseId: { type: string, format: uuid }
        workspaceMode: { type: string, const: ISOLATED_WORKTREE }
        physicalWorkspaceKind:
          type: string
          enum: [DIRECTORY_ONLY, GIT_WORKTREE]
          description: Physical implementation actually provisioned; DIRECTORY_ONLY is not a Git Worktree.
        workspaceRef:
          type: string
          minLength: 1
          description: Logical reservation identity; not a filesystem path or provisioning proof.
        branchRef:
          type: string
          minLength: 1
          description: Deterministic branch identity; materialized only for GIT_WORKTREE Leases.
        status: { type: string, enum: [RESERVED, PROVISIONED, RELEASED, EXPIRED] }
        provisioningState: { type: string, enum: [NOT_STARTED, PROVISIONING, PROVISIONED, FAILED, CLEANUP_PENDING, CLEANED] }
        workspacePath:
          type: [string, 'null']
          description: Control Plane-owned DIRECTORY_ONLY or GIT_WORKTREE path below the provisioning root.
        leaseExpiresAt: { type: [string, 'null'], format: date-time }
        provisioningStartedAt: { type: [string, 'null'], format: date-time }
        provisionedAt: { type: [string, 'null'], format: date-time }
        failureCode: { type: [string, 'null'] }
        failureMessage: { type: [string, 'null'] }
        cleanedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
    ParallelScheduleEvent:
      type: object
      additionalProperties: false
      required: [eventId, eventType, actor, payload, occurredAt]
      properties:
        eventId: { type: integer, format: int64, minimum: 1 }
        eventType:
          type: string
          enum: [PROPOSED, APPROVED, REJECTED, STALE, DISPATCHED, ASSIGNMENT_EXECUTION_CHANGED]
        actor: { type: string, minLength: 1 }
        payload: { type: object }
        occurredAt: { type: string, format: date-time }
    ArchiveTaskRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    TaskHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/TaskHistoryTask' }
        nextCursor: { type: [string, 'null'], maxLength: 500 }
        hasMore: { type: boolean }
    ProjectActivityPage:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - projectId
        - status
        - requestedAfterCursor
        - latestCursor
        - retentionFloorCursor
        - nextCursor
        - hasMore
        - events
      properties:
        schemaVersion: { type: string, const: '1.0' }
        projectId: { type: string, format: uuid }
        status: { type: string, enum: [READY, RESYNC_REQUIRED] }
        requestedAfterCursor: { type: [integer, 'null'], format: int64, minimum: 0 }
        latestCursor: { type: integer, format: int64, minimum: 0 }
        retentionFloorCursor: { type: integer, format: int64, minimum: 0 }
        nextCursor: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        events:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ProjectActivityEvent' }
    ProjectActivityEvent:
      type: object
      additionalProperties: false
      required: [cursor, eventId, projectId, changeType, resourceType, resourceId, taskId, attemptId, sourceEventId, occurredAt]
      properties:
        cursor: { type: integer, format: int64, minimum: 1 }
        eventId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        changeType: { type: string, minLength: 1 }
        resourceType: { type: string, minLength: 1 }
        resourceId: { type: string, minLength: 1 }
        taskId: { type: [string, 'null'], format: uuid }
        attemptId: { type: [string, 'null'], format: uuid }
        sourceEventId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    ProjectMetrics:
      type: object
      additionalProperties: false
      required: [schemaVersion, projectId, windowHours, generatedAt, attempts, tokens, activity]
      properties:
        schemaVersion: { type: string, const: '1.0' }
        projectId: { type: string, format: uuid }
        windowHours: { type: integer, minimum: 1, maximum: 2160 }
        generatedAt: { type: string, format: date-time }
        attempts:
          type: object
          additionalProperties: false
          required: [total, terminal, succeeded, failed, lost, aborted, active, unknownHealth, lostHealth, failureRate, p50DurationMs, p95DurationMs]
          properties:
            total: { type: integer, format: int64, minimum: 0 }
            terminal: { type: integer, format: int64, minimum: 0 }
            succeeded: { type: integer, format: int64, minimum: 0 }
            failed: { type: integer, format: int64, minimum: 0 }
            lost: { type: integer, format: int64, minimum: 0 }
            aborted: { type: integer, format: int64, minimum: 0 }
            active: { type: integer, format: int64, minimum: 0 }
            unknownHealth: { type: integer, format: int64, minimum: 0 }
            lostHealth: { type: integer, format: int64, minimum: 0 }
            failureRate: { type: number, minimum: 0, maximum: 1 }
            p50DurationMs: { type: integer, format: int64, minimum: 0 }
            p95DurationMs: { type: integer, format: int64, minimum: 0 }
        tokens:
          type: object
          additionalProperties: false
          required: [brainRuns, inputTokens, outputTokens, totalTokens]
          properties:
            brainRuns: { type: integer, format: int64, minimum: 0 }
            inputTokens: { type: integer, format: int64, minimum: 0 }
            outputTokens: { type: integer, format: int64, minimum: 0 }
            totalTokens: { type: integer, format: int64, minimum: 0 }
        activity:
          type: object
          additionalProperties: false
          required: [eventCount, latestCursor, retentionFloorCursor, latestEventAt, latestEventLagMs]
          properties:
            eventCount: { type: integer, format: int64, minimum: 0 }
            latestCursor: { type: integer, format: int64, minimum: 0 }
            retentionFloorCursor: { type: integer, format: int64, minimum: 0 }
            latestEventAt: { type: [string, 'null'], format: date-time }
            latestEventLagMs: { type: [integer, 'null'], format: int64, minimum: 0 }
    TaskHistoryTask:
      type: object
      additionalProperties: false
      required:
        - taskId
        - projectId
        - profileId
        - title
        - objective
        - status
        - attemptStatus
        - resolutionStatus
        - attemptId
        - attemptNumber
        - runtimeRunId
        - runtimeHealthStatus
        - lastHeartbeatAt
        - leaseExpiresAt
        - unknownSince
        - lostAt
        - lostReason
        - createdAt
        - startedAt
        - completedAt
        - errorCode
        - errorMessage
        - archivedAt
        - archivedBy
        - archiveReason
      properties:
        taskId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        profileId: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        objective: { type: string, minLength: 1 }
        status: { type: string, enum: [PENDING, STARTING, RUNNING, WAITING_APPROVAL, CANCELLING, SUCCEEDED, FAILED, LOST, ABORTED] }
        attemptStatus: { type: string, enum: [PENDING, STARTING, RUNNING, WAITING_APPROVAL, CANCELLING, SUCCEEDED, FAILED, LOST, ABORTED] }
        resolutionStatus: { type: string, enum: [OPEN, IN_PROGRESS, WAITING_ACCEPTANCE, NEEDS_FOLLOW_UP, RESOLVED, CLOSED] }
        attemptId: { type: [string, 'null'], format: uuid }
        attemptNumber: { type: [integer, 'null'], minimum: 1 }
        runtimeRunId: { type: [string, 'null'] }
        runtimeHealthStatus: { type: [string, 'null'], enum: [NOT_MONITORED, HEALTHY, UNKNOWN, LOST, TERMINATED, null] }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
        leaseExpiresAt: { type: [string, 'null'], format: date-time }
        unknownSince: { type: [string, 'null'], format: date-time }
        lostAt: { type: [string, 'null'], format: date-time }
        lostReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        archivedAt: { type: [string, 'null'], format: date-time }
        archivedBy: { type: [string, 'null'] }
        archiveReason: { type: [string, 'null'] }
    TaskFollowUpCommandRequest:
      type: object
      additionalProperties: false
      required: [parentAttemptId, clientRequestId, feedback, requestedAcceptance]
      properties:
        parentAttemptId: { type: string, format: uuid }
        clientRequestId: { type: string, minLength: 1, maxLength: 120 }
        feedback: { type: string, minLength: 1, maxLength: 20000 }
        requestedAcceptance: { type: string, minLength: 1, maxLength: 20000 }
        connectionRef: { type: [string, 'null'] }
        executor: { type: [string, 'null'], enum: [claude, codex, opencode, null] }
        modelAlias: { type: [string, 'null'] }
        approvalMode: { type: [string, 'null'], enum: [MANUAL, AUTO_SAFE, AUTO_TRUSTED, null] }
        additionalContext: { type: object }
    TaskAcceptanceCommandRequest:
      type: object
      additionalProperties: false
      required: [attemptId, clientRequestId, decision, reason]
      properties:
        attemptId: { type: string, format: uuid }
        clientRequestId: { type: string, minLength: 1, maxLength: 120 }
        decision: { type: string, enum: [RESOLVED, NEEDS_FOLLOW_UP, CLOSED] }
        reason: { type: string, minLength: 1, maxLength: 20000 }
    ClaimWorkOrderRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, planId, nodeKey, profileId]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 160 }
        planId: { type: string, format: uuid }
        nodeKey: { type: string, minLength: 1 }
        profileId: { type: string, format: uuid }
        approvalMode: { type: string, enum: [MANUAL, AUTO_SAFE, AUTO_TRUSTED] }
    VerifyExecutionReportRequest:
      type: object
      additionalProperties: false
      required: [reportId, decision, reason]
      properties:
        reportId: { type: string, format: uuid }
        decision: { type: string, enum: [PASSED, FAILED] }
        reason: { type: string, minLength: 1 }
    WorkOrderBrainHandoffRequest:
      type: object
      additionalProperties: false
      required:
        - verificationId
        - threadId
        - contextPackageId
        - provider
        - model
        - permissions
        - compositeContextVersion
        - inputTokens
        - outputTokens
        - userMessage
        - brainMessage
        - citations
      properties:
        verificationId: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        contextPackageId: { type: string, format: uuid }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        permissions: { type: object }
        compositeContextVersion: { $ref: '../project-state-v1/project-state.schema.json#/$defs/CompositeContextVersionV1' }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        userMessage: { type: string, minLength: 1 }
        brainMessage: { type: string, minLength: 1 }
        citations: { type: array, items: { type: object } }
        generatedProposal: { type: [object, 'null'] }
    PublishPlanProposalRequest:
      type: object
      additionalProperties: false
      required: [approvedNodeKeys]
      properties:
        approvedNodeKeys:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    RejectPlanProposalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    CreateBrainThreadRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
    RecordBrainRunRequest:
      type: object
      additionalProperties: false
      required:
        - contextPackageId
        - provider
        - model
        - permissions
        - compositeContextVersion
        - inputTokens
        - outputTokens
        - userMessage
        - brainMessage
        - citations
      properties:
        contextPackageId: { type: string, format: uuid }
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        permissions: { type: object }
        compositeContextVersion: { $ref: '../project-state-v1/project-state.schema.json#/$defs/CompositeContextVersionV1' }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        userMessage: { type: string, minLength: 1 }
        brainMessage: { type: string, minLength: 1 }
        citations: { type: array, items: { type: object } }
        generatedProposal: { type: [object, 'null'] }
    StateProposalEntryInput:
      type: object
      additionalProperties: false
      required: [title, content, evidenceReferenceIds]
      properties:
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        rationale: { type: [string, 'null'] }
        evidenceReferenceIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    InitialStateProposalInput:
      type: object
      additionalProperties: false
      required: [goal, stage, decisions, constraints, risks]
      properties:
        goal: { type: string, minLength: 1 }
        stage: { type: string, minLength: 1 }
        summary: { type: [string, 'null'] }
        blocker: { type: [string, 'null'] }
        decisions: { type: array, items: { $ref: '#/components/schemas/StateProposalEntryInput' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/StateProposalEntryInput' } }
        risks: { type: array, items: { $ref: '#/components/schemas/StateProposalEntryInput' } }
    ConfirmStateProposalRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 120 }
    RejectStateProposalRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, reason]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 120 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    StateStewardCandidate:
      type: object
      additionalProperties: false
      required: [entryType, title, content]
      properties:
        entryType: { type: string, enum: [DISCOVERY, DECISION, CONSTRAINT, RISK] }
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        rationale: { type: [string, 'null'] }
        evidenceReferenceIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    StructuredExecutionReportV1:
      type: object
      additionalProperties: false
      required: [reportId, reportVersion, result]
      properties:
        reportId: { type: string, format: uuid }
        reportVersion: { type: string, const: '1.0' }
        result: { type: string, enum: [SUCCESS, PARTIAL, BLOCKED, FAILED] }
        discoveries: { type: array, items: { $ref: '#/components/schemas/StateStewardCandidate' } }
        decisions: { type: array, items: { $ref: '#/components/schemas/StateStewardCandidate' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/StateStewardCandidate' } }
        risks: { type: array, items: { $ref: '#/components/schemas/StateStewardCandidate' } }
    StateChangeProposalCandidate:
      type: object
      additionalProperties: false
      required:
        - candidateKey
        - entryType
        - title
        - content
        - disposition
        - mergedCandidateCount
        - existingEntryId
        - evidenceReferenceIds
      properties:
        candidateKey: { type: string, minLength: 1 }
        entryType: { type: string, enum: [DISCOVERY, DECISION, CONSTRAINT, RISK] }
        title: { type: string, minLength: 1 }
        content: { type: string, minLength: 1 }
        rationale: { type: [string, 'null'] }
        disposition: { type: string, enum: [NEW, STALE, CONFLICT] }
        mergedCandidateCount: { type: integer, minimum: 1 }
        existingEntryId: { type: [string, 'null'], format: uuid }
        evidenceReferenceIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    StateChangeProposalPayload:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - proposalType
        - roleVersion
        - promptVersion
        - reportId
        - result
        - candidates
        - summary
        - permissions
      properties:
        schemaVersion: { type: string, const: '1.0' }
        proposalType: { type: string, const: STATE_CHANGE }
        roleVersion: { type: string, const: 'state-steward:v1' }
        promptVersion: { type: string, minLength: 1 }
        reportId: { type: string, format: uuid }
        result: { type: string, enum: [SUCCESS, PARTIAL, BLOCKED, FAILED] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/StateChangeProposalCandidate' }
        summary:
          type: object
          additionalProperties: false
          required: [extracted, newCandidates, staleCandidates, conflictCandidates, mergedCandidates]
          properties:
            extracted: { type: integer, minimum: 0 }
            newCandidates: { type: integer, minimum: 0 }
            staleCandidates: { type: integer, minimum: 0 }
            conflictCandidates: { type: integer, minimum: 0 }
            mergedCandidates: { type: integer, minimum: 0 }
        permissions:
          type: object
          additionalProperties: { type: boolean }
    ProjectStateProposal:
      type: object
      required:
        - proposalId
        - projectId
        - schemaVersion
        - proposalType
        - status
        - baseStateRevision
        - payload
        - validationResult
        - sourceType
        - sourceId
        - createdBy
        - createdAt
        - decidedBy
        - decidedAt
        - appliedRevision
      properties:
        proposalId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        schemaVersion: { type: string, const: '1.0' }
        proposalType: { type: string, enum: [INITIAL_STATE, STATE_CHANGE] }
        status: { type: string, enum: [PENDING_APPROVAL, APPLIED, STALE, REJECTED, FAILED] }
        baseStateRevision: { type: integer, format: int64, minimum: 0 }
        payload:
          oneOf:
            - { $ref: '#/components/schemas/InitialStateProposalInput' }
            - { $ref: '#/components/schemas/StateChangeProposalPayload' }
        validationResult: { type: object }
        sourceType: { type: string, minLength: 1 }
        sourceId: { type: string, minLength: 1 }
        createdBy: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        appliedRevision: { type: [integer, 'null'], format: int64, minimum: 0 }
    GenerateContextRequest:
      type: object
      additionalProperties: false
      required: [packageType]
      properties:
        packageType: { type: string, enum: [BRAIN, PLANNER] }
    ConfirmWorkspaceBindingRequest:
      type: object
      additionalProperties: false
      required: [proposalId, action, machineId, workspacePath, baseIdentityVersion, clientRequestId]
      properties:
        proposalId: { type: string, format: uuid }
        action: { type: string, enum: [MOVE_WORKSPACE, REBIND_LOCAL_PROJECT] }
        machineId: { type: string, minLength: 1 }
        localProjectId: { type: [string, 'null'], minLength: 1 }
        workspacePath: { type: string, minLength: 1 }
        baseIdentityVersion: { type: integer, minimum: 1 }
        clientRequestId: { type: string, minLength: 1, maxLength: 120 }
    WorkspaceBindingChange:
      type: object
      additionalProperties: false
      required:
        - changeId
        - proposalId
        - action
        - actor
        - clientRequestId
        - baseIdentityVersion
        - resultingIdentityVersion
        - binding
        - createdAt
      properties:
        changeId: { type: string, format: uuid }
        proposalId: { type: string, format: uuid }
        action: { type: string, enum: [MOVE_WORKSPACE, REBIND_LOCAL_PROJECT] }
        actor: { type: string, minLength: 1 }
        clientRequestId: { type: string, minLength: 1 }
        baseIdentityVersion: { type: integer, minimum: 1 }
        resultingIdentityVersion: { type: integer, minimum: 2 }
        binding: { $ref: './project-identity.schema.json#/$defs/WorkspaceBindingV1' }
        createdAt: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Missing or invalid Project Control service credential.
    ServiceCredentialUnavailable:
      description: Project Control service credential is not configured.
