openapi: 3.1.0
info:
  title: Zhishu Project Control Internal API
  version: 1.19.0
  description: >-
    Service-credential protected Node BFF to Control Plane protocol. Execution reads
    reuse existing projections; semantic state writes and parallel scheduling are
    proposal-first and actor-audited. Workspace provisioning is a controlled
    marked-directory operation; Integration evidence is captured as immutable snapshots,
    and Git-backed Worktree operations are not implicit. Successful Integration candidates
    require an explicit ownership-checked, clean-primary fast-forward finalization request.
servers:
  - url: http://127.0.0.1:8080
security:
  - projectControlToken: []
paths:
  /internal/project-control/v1/workspaces/resolve:
    get:
      operationId: resolveWorkspaceObservation
      parameters:
        - { name: machineId, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: localProjectId, in: query, required: false, schema: { type: string, minLength: 1 } }
        - { name: normalizedWorkspacePath, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: remoteFingerprint, in: query, required: false, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Deterministic match, ambiguity, or not-found result.
          content:
            application/json:
              schema:
                $ref: ./project-identity.schema.json
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceCredentialUnavailable' }
  /internal/project-control/v1/tasks:
    get:
      operationId: listProjectControlTasks
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Existing Task projections.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../control-v1/openapi.yaml#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/tasks:
    get:
      operationId: searchProjectTaskHistory
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: archive
          in: query
          schema: { type: string, enum: [ACTIVE, ARCHIVED, ALL], default: ACTIVE }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, STARTING, RUNNING, WAITING_APPROVAL, CANCELLING, SUCCEEDED, FAILED, LOST, ABORTED] }
        - name: resolutionStatus
          in: query
          schema: { type: string, enum: [OPEN, IN_PROGRESS, WAITING_ACCEPTANCE, NEEDS_FOLLOW_UP, RESOLVED, CLOSED] }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 500 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Bounded, project-scoped Task history page.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskHistoryPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/tasks/{taskId}:
    get:
      operationId: getProjectTaskHistoryItem
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200':
          description: Active or archived Task history item.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskHistoryTask' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
  /internal/project-control/v1/projects/{projectId}/tasks/{taskId}/attempts:
    get:
      operationId: listProjectTaskHistoryAttempts
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200':
          description: Attempt history for an active or archived Task.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../control-v1/openapi.yaml#/components/schemas/TaskAttempt' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
  /internal/project-control/v1/projects/{projectId}/activity:
    get:
      operationId: readProjectActivity
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: after
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Durable project activity page. RESYNC_REQUIRED requires a full snapshot refresh.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProjectActivityPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
  /internal/project-control/v1/projects/{projectId}/metrics:
    get:
      operationId: readProjectMetrics
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: windowHours
          in: query
          schema: { type: integer, minimum: 1, maximum: 2160, default: 168 }
      responses:
        '200':
          description: Bounded project performance, token, error and health metrics.
          content: { application/json: { schema: { $ref: '#/components/schemas/ProjectMetrics' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
  /internal/project-control/v1/tasks/{taskId}:
    get:
      operationId: getProjectControlTask
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200':
          description: Existing Task projection.
          content: { application/json: { schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
  /internal/project-control/v1/tasks/{taskId}/attempts:
    get:
      operationId: listProjectControlTaskAttempts
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200':
          description: Existing Attempt projections.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../control-v1/openapi.yaml#/components/schemas/TaskAttempt' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/tasks/{taskId}/retry:
    post:
      operationId: retryProjectControlTask
      description: Creates a new Attempt for the current terminal Task while preserving its execution snapshots.
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/Actor' }
      responses:
        '202':
          description: A distinct replacement Attempt was accepted.
          content: { application/json: { schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/tasks/{taskId}/cancel:
    post:
      operationId: cancelProjectControlTask
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/Actor' }
      responses:
        '202':
          description: The current Attempt is cancelling or was already terminal.
          content: { application/json: { schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/tasks/{taskId}/archive:
    post:
      operationId: archiveProjectControlTask
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveTaskRequest' }
      responses:
        '200':
          description: Terminal Task marked archived while evidence remains durable.
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskHistoryTask' } } }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/tasks/{taskId}/approvals:
    get:
      operationId: listProjectControlTaskApprovals
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200':
          description: Existing Approval projections.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../control-v1/openapi.yaml#/components/schemas/Approval' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/tasks/{taskId}/artifacts:
    get:
      operationId: listProjectControlTaskArtifacts
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200':
          description: Existing Artifact projections.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../control-v1/openapi.yaml#/components/schemas/TaskArtifact' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/tasks/{taskId}/follow-ups:
    get:
      operationId: listProjectControlTaskFollowUps
      parameters: [ { $ref: '#/components/parameters/TaskId' } ]
      responses:
        '200':
          description: Existing Follow-up projections.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../control-v1/openapi.yaml#/components/schemas/TaskFollowUp' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createProjectControlTaskFollowUp
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskFollowUpCommandRequest' }
      responses:
        '202':
          description: Idempotently created Follow-up and replacement Attempt.
          content: { application/json: { schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/TaskFollowUp' } } }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/tasks/{taskId}/acceptance:
    post:
      operationId: acceptProjectControlTaskResult
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskAcceptanceCommandRequest' }
      responses:
        '200':
          description: Idempotently recorded the user acceptance decision.
          content: { application/json: { schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/TaskAcceptance' } } }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/approvals/{approvalId}/decision:
    post:
      operationId: decideProjectControlApproval
      parameters:
        - { $ref: '#/components/parameters/ApprovalId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Approval decision accepted by the existing Runtime boundary.
          content: { application/json: { schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/Approval' } } }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '../control-v1/openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/approval-policy:
    get:
      operationId: getProjectControlApprovalPolicy
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Existing project approval policy projection.
          content:
            application/json:
              schema: { $ref: '../control-v1/openapi.yaml#/components/schemas/ProjectApprovalPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/workspace-bindings/{workspaceId}/confirm:
    post:
      operationId: confirmWorkspaceBindingProposal
      description: >-
        Applies only the current deterministic MOVE_WORKSPACE or REBIND_LOCAL_PROJECT proposal.
        The caller must supply a user-derived actor and an idempotency key.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: workspaceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Zhishu-Actor
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmWorkspaceBindingRequest' }
      responses:
        '200':
          description: Applied or idempotently replayed binding change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceBindingChange' }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/state:
    get:
      operationId: getProjectStateSnapshot
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200':
          description: Current rebuildable semantic state snapshot and active entries.
          content:
            application/json:
              schema: { $ref: '../project-state-v1/project-state.schema.json#/$defs/ProjectStateSnapshotV1' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/state/initial-proposals:
    post:
      operationId: createInitialProjectStateProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitialStateProposalInput' }
      responses:
        '201': { description: Validated proposal pending explicit confirmation. }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/state/proposals/{proposalId}/confirm:
    post:
      operationId: confirmProjectStateProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ProposalId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmStateProposalRequest' }
      responses:
        '200': { description: Applied or idempotently replayed Project Change. }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/state/proposals:
    get:
      operationId: listProjectStateProposals
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: proposalType
          in: query
          required: false
          schema: { type: string, enum: [INITIAL_STATE, STATE_CHANGE] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Newest-first proposal audit history for the project.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectStateProposal' }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/state/steward/proposals:
    post:
      operationId: createStateStewardProposal
      deprecated: true
      description: >-
        Trusted internal compatibility endpoint for an already structured report.
        Browser clients must use the report-id endpoint so candidate text is derived
        from immutable Execution Report and Artifact snapshots inside Project Control.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StructuredExecutionReportV1' }
      responses:
        '201':
          description: Idempotently created or replayed State Change Proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectStateProposal' }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/state/steward/reports/{reportId}/proposal:
    post:
      operationId: createStateStewardProposalFromExecutionReport
      description: >-
        Derives StructuredExecutionReportV1 from immutable report and artifact snapshots.
        The report must have PASSED Human Verification. FACT candidates are never inferred.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Actor' }
      responses:
        '201':
          description: Idempotently created or replayed State Change Proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectStateProposal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/state/proposals/{proposalId}/reject:
    post:
      operationId: rejectProjectStateProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ProposalId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectStateProposalRequest' }
      responses:
        '200': { description: Audited rejection without changing State Revision. }
        '400': { $ref: '../control-v1/openapi.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/changes:
    get:
      operationId: listProjectChanges
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: afterRevision, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Revision-ordered change feed for bounded polling. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/contexts:
    post:
      operationId: generateProjectContextPackage
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateContextRequest' }
      responses:
        '201':
          description: Generated and archived explainable Context Package.
          content:
            application/json:
              schema: { $ref: '../project-state-v1/project-state.schema.json#/$defs/ContextPackageV1' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/contexts/{packageId}:
    get:
      operationId: getArchivedProjectContextPackage
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - name: packageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exact archived Context Package payload.
          content:
            application/json:
              schema: { $ref: '../project-state-v1/project-state.schema.json#/$defs/ContextPackageV1' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/brain/threads:
    get:
      operationId: listProjectBrainThreads
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Project Brain threads. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createProjectBrainThread
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBrainThreadRequest' }
      responses:
        '201': { description: Created Brain Thread. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/brain/threads/{threadId}/messages:
    get:
      operationId: listProjectBrainMessages
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ThreadId' }
      responses:
        '200': { description: Audited user and Brain messages pinned to Context Packages. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/brain/threads/{threadId}/runs:
    post:
      operationId: recordProjectBrainRun
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ThreadId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordBrainRunRequest' }
      responses:
        '201': { description: Audited no-tool Brain Run and message pair. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans:
    get:
      operationId: listProjectPlans
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Current published plans with immutable definitions and mutable execution state. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}:
    get:
      operationId: getProjectPlan
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
      responses:
        '200': { description: Current Plan Version, nodes, dependencies and execution state. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedules:
    get:
      operationId: listParallelScheduleProposals
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Bounded Plan-scoped Parallel Schedule proposal and decision audit history.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParallelSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createParallelScheduleProposal
      description: >-
        Proposes exactly two independent READY nodes with disjoint explicit scopes,
        deterministic enabled Profiles, distinct logical isolated Workspace Leases, and an
        explicit physical Workspace kind. GIT_WORKTREE freezes the server-bound repository
        root and full HEAD commit; DIRECTORY_ONLY remains the marked-directory mode.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateParallelScheduleRequest' }
      responses:
        '201':
          description: Pending proposal with two proposed assignments and two logical lease reservations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/capability-matrix:
    get:
      operationId: getSchedulerCapabilityMatrix
      description: >-
        Read-only Scheduler and Worker Capability Matrix for the current Plan.
        This operation explains enabled and disabled Profile matches, capability gaps,
        node readiness, and active Schedule blockers without reserving workers or creating
        Schedule, Lease, Work Order, Agent, branch, or Worktree state.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
      responses:
        '200':
          description: Plan-scoped read-only Scheduler and Worker Capability Matrix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulerCapabilityMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedule-candidates:
    get:
      operationId: getSchedulerCandidatePairs
      description: >-
        Read-only deterministic evaluation of two-node Parallel Schedule candidates.
        The result explains node readiness, Profile matching, transitive dependency direction,
        normalized scope overlap, and active Schedule conflicts without reserving workers or
        creating Schedule, Lease, Work Order, Agent, branch, or Worktree state.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Bounded Plan-scoped two-node candidate evaluation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulerCandidatePairMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedule-recommendation:
    get:
      operationId: getSchedulerRecommendation
      description: >-
        Read-only deterministic ranking and recommendation over the bounded Parallel Schedule
        candidate evaluation. The response exposes score components and selection reasons and
        does not create Schedule, Lease, Work Order, Agent, branch, or Worktree state.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
      responses:
        '200':
          description: Stable candidate ranking and optional preferred pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulerRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedules/{scheduleId}/confirm:
    post:
      operationId: confirmParallelScheduleProposal
      description: >-
        Approves a current proposal and moves its assignments to READY_FOR_PROVISIONING.
        No Work Order, Agent execution, or physical Worktree is created.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/ScheduleId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParallelScheduleDecisionRequest' }
      responses:
        '200':
          description: Approved proposal and immutable approval event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedules/{scheduleId}/reject:
    post:
      operationId: rejectParallelScheduleProposal
      description: Rejects a pending proposal and releases both logical Workspace Leases.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/ScheduleId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectParallelScheduleRequest' }
      responses:
        '200':
          description: Rejected proposal with released assignments, leases, and immutable decision event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedules/{scheduleId}/workspace-leases/{leaseId}/provision:
    post:
      operationId: provisionParallelScheduleWorkspaceLease
      description: >-
        Claims one approved logical Lease and invokes the physical adapter frozen by
        the Schedule. DIRECTORY_ONLY creates a marked directory. GIT_WORKTREE validates
        the server-bound repository and frozen commit before creating a deterministic
        isolated branch/Worktree. Interrupted operations are reconciler-recoverable.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/ScheduleId' }
        - { $ref: '#/components/parameters/LeaseId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceLeaseProvisionRequest' }
      responses:
        '200':
          description: Schedule with the provisioned lease and durable ownership metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelSchedule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/parallel-schedules/{scheduleId}/dispatch:
    post:
      operationId: dispatchParallelSchedule
      description: >-
        Atomically claims the two assignments of an approved Schedule after both
        isolated Leases are physically provisioned. Each Work Order is bound
        to its Schedule Assignment, Profile, Lease, and immutable workspace path;
        the existing Execution Bridge then dispatches both Tasks. This operation
        does not invoke Git, create a Worktree, merge, apply, build, or test.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/ScheduleId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParallelScheduleDispatchRequest' }
      responses:
        '201':
          description: Idempotently dispatched Schedule with exactly two Work Orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParallelScheduleDispatch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates:
    get:
      operationId: listIntegrationGateProposals
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Bounded proposal-only Integration Gate history for a Plan.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/IntegrationGate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createIntegrationGateProposal
      description: >-
        Creates an evidence-only Integration Gate proposal from an approved and
        physically provisioned Parallel Schedule. It never creates Work Orders,
        runs Agents, invokes Git, merges, applies, builds, or tests.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIntegrationGateRequest' }
      responses:
        '201':
          description: Proposal with applyState NOT_ATTEMPTED and a sealed immutable evidence snapshot manifest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}:
    get:
      operationId: getIntegrationGateProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
      responses:
        '200':
          description: Integration Gate proposal, captured evidence snapshots, and immutable event history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}/confirm:
    post:
      operationId: confirmIntegrationGateProposal
      description: >-
        Approves the evidence-only proposal. applyState remains NOT_ATTEMPTED;
        this operation is not evidence that a merge, build, test, or Agent run occurred.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationGateDecisionRequest' }
      responses:
        '200':
          description: Approved proposal with applyState NOT_ATTEMPTED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}/reject:
    post:
      operationId: rejectIntegrationGateProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectIntegrationGateRequest' }
      responses:
        '200':
          description: Rejected proposal with immutable decision event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationGate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}/executions:
    post:
      operationId: executeIntegrationGate
      description: >-
        Asynchronously claims an approved GIT_WORKTREE Integration Gate and applies both
        verified Worker results in a separate Integration Worktree. The primary Worktree is
        never modified. Build/test commands come from a frozen server-owned NPM or MAVEN
        project preset; clients never submit argv. Failures produce
        durable step evidence and an approval-only automatic Replan Proposal.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationExecutionRequest' }
      responses:
        '201':
          description: Claimed Integration Run, normally in PREPARING while background steps execute.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}/executions/{runId}:
    get:
      operationId: getIntegrationExecution
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Durable Integration Run and bounded apply/build/test evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}/executions/{runId}/finalize:
    post:
      operationId: finalizeIntegrationExecution
      description: >-
        Explicitly fast-forwards the clean, attached primary Worktree from the frozen base
        commit to the exact successful candidate commit, then removes only the ownership-marked
        Integration Worktree and local Integration branch. It never contacts a remote and never
        creates a merge commit. Apply and cleanup are resumable and durably audited.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationFinalizationRequest' }
      responses:
        '200':
          description: Durable finalization state, including resumable apply or cleanup failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationExecution' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/{planId}/integration-gates/{gateId}/executions/{runId}/agent:
    post:
      operationId: startIntegrationAgent
      description: Starts the existing Runtime Agent only in a retained failed Integration Worktree.
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PlanId' }
        - { $ref: '#/components/parameters/GateId' }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationAgentRequest' }
      responses:
        '201':
          description: Integration Agent Run bound to an existing Task/Attempt and isolated workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationAgentRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/proposals:
    get:
      operationId: listPlanProposals
      parameters: [ { $ref: '#/components/parameters/ProjectId' } ]
      responses:
        '200': { description: Plan proposals with computed version diff. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPlanProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../project-intelligence-v1/plan-proposal.schema.json' }
      responses:
        '201': { description: Pending proposal; no Plan Version or Task is created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/proposals/{proposalId}/publish:
    post:
      operationId: publishPlanProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ProposalId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishPlanProposalRequest' }
      responses:
        '201': { description: Immutable Plan Version published after stale and capability validation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/plans/proposals/{proposalId}/reject:
    post:
      operationId: rejectPlanProposal
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/ProposalId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectPlanProposalRequest' }
      responses:
        '200': { description: Rejected proposal with actor and reason. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/work-orders:
    get:
      operationId: listWorkOrders
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { name: planId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: nodeKey, in: query, required: false, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: Historical Work Orders and their existing Task bindings.
          content:
            application/json:
              schema: { type: array, items: { $ref: '../work-order-v1/work-order.schema.json' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/project-control/v1/projects/{projectId}/work-orders/{workOrderId}:
    get:
      operationId: getWorkOrder
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/WorkOrderId' }
      responses:
        '200':
          description: Replayable Work Order, binding, reports, verifications and events.
          content:
            application/json:
              schema: { $ref: '../work-order-v1/work-order.schema.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/work-orders/claims:
    post:
      operationId: claimAndDispatchWorkOrder
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimWorkOrderRequest' }
      responses:
        '201':
          description: Idempotently claimed Work Order bound to exactly one existing Task and first Attempt.
          content:
            application/json:
              schema: { $ref: '../work-order-v1/work-order.schema.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/work-orders/{workOrderId}/verifications:
    post:
      operationId: verifyExecutionReport
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyExecutionReportRequest' }
      responses:
        '201': { description: Human Verification plus fresh Brain Context handoff. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
  /internal/project-control/v1/projects/{projectId}/work-orders/{workOrderId}/brain-handoff:
    post:
      operationId: recordWorkOrderBrainHandoff
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/WorkOrderId' }
        - { $ref: '#/components/parameters/Actor' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderBrainHandoffRequest' }
      responses:
        '201': { description: Replay-safe audited Brain summary pinned to the post-reducer Context Package. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '../control-v1/openapi.yaml#/components/responses/Conflict' }
components:
  securitySchemes:
    projectControlToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Actor:
      name: X-Zhishu-Actor
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    ThreadId:
      name: threadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeaseId:
      name: leaseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GateId:
      name: gateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CreateParallelScheduleRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, baseStateRevision, basePlanVersion, nodeKeys]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 160 }
        baseStateRevision: { type: integer, format: int64, minimum: 0 }
        basePlanVersion: { type: integer, format: int64, minimum: 1 }
        nodeKeys:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { type: string, minLength: 1 }
        physicalWorkspaceKind:
          type: string
          enum: [DIRECTORY_ONLY, GIT_WORKTREE]
          default: DIRECTORY_ONLY
    ParallelScheduleDecisionRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 160 }
    RejectParallelScheduleRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, reason]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    WorkspaceLeaseProvisionRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 160 }
    ParallelScheduleDispatchRequest:
