<!DOCTYPE html>
<html>
<head>
    <title>知枢 - 清理缓存</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>清理缓存与 Service Worker</h1>
    <p>如果页面空白或仍显示旧内容，可以清理缓存后重新加载。</p>

    <button onclick="clearEverything()">清理缓存并重新加载</button>

    <div id="status"></div>

    <script>
        async function clearEverything() {
            const status = document.getElementById('status');
            status.innerHTML = '<p>正在清理缓存和 Service Worker...</p>';

            try {
                // Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        status.innerHTML += '<p class="success">✓ Unregistered service worker</p>';
                    }
                }

                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        status.innerHTML += `<p class="success">✓ Deleted cache: ${cacheName}</p>`;
                    }
                }

                // Clear localStorage
                localStorage.clear();
                status.innerHTML += '<p class="success">✓ Cleared localStorage</p>';

                // Clear sessionStorage
                sessionStorage.clear();
                status.innerHTML += '<p class="success">✓ Cleared sessionStorage</p>';

                status.innerHTML += '<p class="success"><strong>✓ All caches cleared!</strong></p>';
                status.innerHTML += '<p>缓存已清理。现在可以关闭此页面，或<a href="/">返回知枢首页</a>。</p>';

            } catch (error) {
                status.innerHTML += `<p class="error">✗ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
