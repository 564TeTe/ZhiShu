services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhishu
      POSTGRES_USER: zhishu
      POSTGRES_PASSWORD: zhishu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhishu -d zhishu"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - zhishu-postgres-data:/var/lib/postgresql/data

volumes:
  zhishu-postgres-data:
